[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "variance-analysis-agent"
dynamic = ["version"]
description = "Budget-versus-actual variance analysis with materiality flags, favorable/unfavorable logic and a Markdown report."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rishabb Shankar" }]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl==3.1.5"]
pdf = ["pdfplumber==0.11.10", "pypdfium2==5.14.0"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "jsonschema==4.26.0", "mypy==2.4.0"]
release = ["build==1.6.1", "twine==7.0.0"]

[project.urls]
Repository = "https://github.com/rishabbshankar226/Variance-Analysis-Agent"
Issues = "https://github.com/rishabbshankar226/Variance-Analysis-Agent/issues"
Changelog = "https://github.com/rishabbshankar226/Variance-Analysis-Agent/blob/main/CHANGELOG.md"

[project.scripts]
variance-agent = "variance_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/variance_agent", "deterministic_conditioning"]

[tool.hatch.version]
path = "src/variance_agent/version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/deterministic_conditioning", "/tests", "/schemas", "/examples", "/docs", "/scripts",
           "/README.md", "/pyproject.toml", "/requirements-typecheck.txt", "/LICENSE", "/CHANGELOG.md",
           "/CONTRIBUTING.md", "/SECURITY.md"]
# Redesign screenshots and the harness that takes them are review evidence, not part of a release.
exclude = ["/docs/ui/evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
# B (bugbear) catches real mistakes such as zip() silently truncating; E501 keeps lines to 140 columns.
select = ["E4", "E7", "E9", "E501", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# These files are mostly long single-line reply, prompt, report and training-text templates, where the
# line is the content. They are also the files other work is editing, so they are wrapped when next touched.
"src/variance_agent/chat/handlers.py" = ["E501"]
"src/variance_agent/chat/knowledge.py" = ["E501"]
"deterministic_conditioning/dataset_generator.py" = ["E501"]
"deterministic_conditioning/router.py" = ["E501"]
"deterministic_conditioning/benchmark.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/variance_agent", "scripts", "deterministic_conditioning"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
