name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,excel]"
      - run: ruff check .
      - run: python -m compileall -q src tests scripts
      - run: pytest
      - run: python -m pip check

  minimal_install:
    name: Minimal installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: |
          python -m venv "$RUNNER_TEMP/minimal-env"
          "$RUNNER_TEMP/minimal-env/bin/python" -m pip install .
          "$RUNNER_TEMP/minimal-env/bin/python" scripts/check_installation.py --without-excel
          "$RUNNER_TEMP/minimal-env/bin/python" -m pip check

  package:
    name: Distribution installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install ".[release]"
      - run: python -m build --outdir "$RUNNER_TEMP/dist"
      - run: python -m twine check "$RUNNER_TEMP"/dist/*
      - run: python scripts/check_distribution.py "$RUNNER_TEMP/dist"
      - run: |
          for artifact in "$RUNNER_TEMP"/dist/*; do
            package_env="$RUNNER_TEMP/package-$(basename "$artifact")"
            python -m venv "$package_env"
            "$package_env/bin/python" -m pip install "$artifact"
            "$package_env/bin/python" scripts/check_installation.py --without-excel
            "$package_env/bin/python" -m pip check
          done

  windows_smoke:
    name: Windows output contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,excel]"
      - run: >-
          pytest tests/test_portable_output.py tests/test_currency.py
          tests/test_contract_fixtures.py tests/test_cli_audit.py tests/test_provenance.py
          tests/test_operator_controls.py

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [test, minimal_install, package, windows_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.minimal_install.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.windows_smoke.result }}" = success
