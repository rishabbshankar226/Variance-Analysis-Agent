<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variance Analysis Agent</title>
<style>
  /* ── Reset & Base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary:    #0f0f1a;
    --bg-secondary:  #1a1a2e;
    --bg-surface:    #16213e;
    --bg-card:       #1e2a4a;
    --text-primary:  #e8e8f0;
    --text-secondary:#a0a0b8;
    --text-muted:    #6b6b80;
    --accent:        #7c3aed;
    --accent-hover:  #6d28d9;
    --accent-glow:   rgba(124, 58, 237, 0.25);
    --green:         #10b981;
    --green-muted:   rgba(16, 185, 129, 0.15);
    --red:           #ef4444;
    --red-muted:     rgba(239, 68, 68, 0.15);
    --amber:         #f59e0b;
    --amber-muted:   rgba(245, 158, 11, 0.15);
    --border:        #2a2a40;
    --radius:        12px;
    --radius-sm:     8px;
    --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --shadow:        0 4px 24px rgba(0, 0, 0, 0.3);
    --transition:    all 0.2s ease;
  }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ───────────────────────────────────────────────── */
  .header {
    background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-surface) 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .header-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }

  .header-text p {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-action-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .header-action-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .header-status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.5; }
  }

  /* ── Messages Area ────────────────────────────────────────── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  /* ── Message Bubbles ──────────────────────────────────────── */
  .message {
    max-width: 85%;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.agent {
    align-self: flex-start;
  }

  .message.user {
    align-self: flex-end;
  }

  .message-sender {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    color: var(--text-muted);
  }

  .message.agent .message-sender { color: var(--accent); }
  .message.user .message-sender  { color: var(--text-muted); text-align: right; }

  .message-body {
    padding: 14px 18px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14px;
  }

  .message.agent .message-body {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .message.user .message-body {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff;
    border-top-right-radius: 4px;
  }

  .message-body strong {
    font-weight: 600;
    color: #fff;
  }

  .message.agent .message-body code {
    background: rgba(124, 58, 237, 0.15);
    color: #c4b5fd;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 13px;
  }

  /* ── Typing Indicator ─────────────────────────────────────── */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 12px 18px;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(1) { animation-delay: 0s; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1.1); opacity: 1; background: var(--accent); }
  }

  /* ── Tables ───────────────────────────────────────────────── */
  .data-table-wrapper {
    margin-top: 12px;
    overflow-x: auto;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    font-family: var(--font-mono);
  }

  .data-table th {
    background: var(--bg-card);
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .data-table td {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(42, 42, 64, 0.5);
    white-space: nowrap;
    color: var(--text-primary);
  }

  .data-table tr:last-child td { border-bottom: none; }

  .data-table tr:hover td {
    background: rgba(124, 58, 237, 0.05);
  }

  .data-table .num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .data-table .status-f {
    color: var(--green);
    font-weight: 500;
  }

  .data-table .status-u {
    color: var(--red);
    font-weight: 500;
  }

  .data-table .row-favorable { border-left: 3px solid var(--green); }
  .data-table .row-unfavorable { border-left: 3px solid var(--red); }
  .data-table .row-neutral { border-left: 3px solid var(--text-muted); }

  .data-table th.sortable {
    cursor: pointer;
    user-select: none;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .data-table th.sortable:hover {
    color: var(--accent);
    background: rgba(124, 58, 237, 0.08);
  }
  .data-table th .sort-icon {
    display: inline-block;
    margin-left: 5px;
    font-size: 10px;
    opacity: 0.35;
    transition: opacity 0.15s ease;
  }
  .data-table th.sorted-asc .sort-icon,
  .data-table th.sorted-desc .sort-icon {
    opacity: 1;
    color: var(--accent);
  }
  .data-table td.clickable-item {
    cursor: pointer;
    color: var(--accent);
    text-decoration: underline dotted;
    text-underline-offset: 3px;
    transition: color 0.15s ease;
  }
  .data-table td.clickable-item:hover {
    color: #a78bfa;
  }
  .variance-cell {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    width: 100%;
  }
  .variance-val {
    font-variant-numeric: tabular-nums;
  }
  .variance-bar-track {
    width: 100%;
    min-width: 48px;
    max-width: 72px;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .variance-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .variance-bar-fill.bar-favorable {
    background: var(--green);
  }
  .variance-bar-fill.bar-unfavorable {
    background: var(--red);
  }
  .variance-bar-fill.bar-neutral {
    background: var(--text-muted);
  }
  .table-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border);
  }
  .table-search-input {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 5px 10px;
    width: 220px;
    max-width: 65%;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .table-search-input:focus {
    border-color: var(--accent);
    background: rgba(0, 0, 0, 0.4);
  }
  .table-row-count {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    white-space: nowrap;
  }

  /* ── Suggestion Chips ─────────────────────────────────────── */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    background: rgba(124, 58, 237, 0.12);
    color: #c4b5fd;
    border: 1px solid rgba(124, 58, 237, 0.25);
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }

  .chip:hover {
    background: rgba(124, 58, 237, 0.25);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .chip:active { transform: translateY(0); }

  /* ── File Drop Zone ───────────────────────────────────────── */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    background: rgba(124, 58, 237, 0.03);
    margin-top: 12px;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .drop-zone-icon {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: 0.7;
  }

  .drop-zone-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .drop-zone-subtitle {
    font-size: 12px;
    color: var(--text-muted);
  }

  .drop-zone input[type="file"] {
    display: none;
  }

  /* ── Input Bar ────────────────────────────────────────────── */
  .input-bar {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-shrink: 0;
  }

  .input-bar input {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 14px;
    outline: none;
    transition: var(--transition);
  }

  .input-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .input-bar input::placeholder {
    color: var(--text-muted);
  }

  .input-bar input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
  }

  .send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  /* ── Warning Message Style ────────────────────────────────── */
  .message-body.warning {
    border-left: 3px solid var(--amber);
    background: var(--amber-muted);
  }

  /* ── Download Button ──────────────────────────────────────── */
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    background: var(--green);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: var(--transition);
  }

  .download-btn:hover {
    background: #059669;
    transform: translateY(-1px);
  }

  /* ── Responsive ───────────────────────────────────────────── */
  @media (max-width: 640px) {
    .header { padding: 12px 16px; }
    .messages { padding: 16px; }
    .input-bar { padding: 12px 16px; }
    .message { max-width: 95%; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-icon">📊</div>
  <div class="header-text">
    <h1>Variance Analysis Agent</h1>
    <p>Deterministic Financial Assistant</p>
  </div>
  <div class="header-actions">
    <button id="btn-quick-help" class="header-action-btn" title="Show available commands">? Help</button>
    <button id="btn-quick-reset" class="header-action-btn" title="Reset session">↺ Reset</button>
    <div class="header-status">
      <div class="dot"></div>
      <span id="phase-label">Ready</span>
    </div>
  </div>
</div>

<!-- Messages -->
<div class="messages" id="messages">
  <!-- Welcome message inserted by JS -->
</div>

<!-- Input Bar -->
<div class="input-bar">
  <input
    type="text"
    id="input"
    placeholder="Upload a file above or ask a financial question..."
    autocomplete="off"
  >
  <button class="send-btn" id="send-btn" title="Send">
    ➤
  </button>
</div>

<script>
(function() {
  'use strict';

  // ── State ──────────────────────────────────────────────────
  let currentPhase = 'awaiting_file';

  // Visitors share one hosted session, so this browser remembers whether its
  // visitor has seen the welcome intro that opens the first file.
  const INTRO_SEEN_KEY = 'variance-agent:intro-seen';
  let introSeen = false;
  try { introSeen = localStorage.getItem(INTRO_SEEN_KEY) === '1'; } catch (_) {}
  function markIntroSeen() {
    introSeen = true;
    try { localStorage.setItem(INTRO_SEEN_KEY, '1'); } catch (_) {}
  }

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');
  const phaseLabel = document.getElementById('phase-label');

  const PHASE_LABELS = {
    awaiting_file:        'Upload File',
    awaiting_period:      'Set Period',
    awaiting_thresholds:  'Set Thresholds',
    awaiting_currency:    'Set Currency',
    resolve_unclassified: 'Classify Items',
    exploring:            'Exploring',
  };

  const PHASE_PLACEHOLDERS = {
    awaiting_file:        'Upload a file above or ask a financial question (e.g., "what is materiality?")...',
    awaiting_period:      'Enter the reporting period (e.g., Q3 2026)...',
    awaiting_thresholds:  'Set thresholds (e.g., $10,000 or 5%)...',
    awaiting_currency:    'Enter currency (USD, EUR, GBP)...',
    resolve_unclassified: 'Revenue, Expense, or Skip...',
    exploring:            'Ask a question (e.g., "why marketing?", "biggest risks")...',
  };

  // ── Init ───────────────────────────────────────────────────
  async function init() {
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    const btnHelp = document.getElementById('btn-quick-help');
    const btnReset = document.getElementById('btn-quick-reset');
    if (btnHelp) {
      btnHelp.addEventListener('click', () => {
        addUserMessage('help');
        postMessage('help');
      });
    }
    if (btnReset) {
      btnReset.addEventListener('click', () => {
        addUserMessage('reset');
        postMessage('reset');
      });
    }

    try {
      const resp = await fetch('/status');
      const data = await resp.json();
      if (data && data.phase && data.phase !== 'awaiting_file') {
        updatePhase(data.phase);
        if (data.initial_response) {
          markIntroSeen();
          addAgentMessage(
            data.initial_response.text,
            data.initial_response.table,
            data.initial_response.chips,
            false
          );
          return;
        }
      }
    } catch (_) {}

    addAgentMessage(
      'Welcome! Upload your financial data to get started.\n\n' +
      'Supported formats: **CSV**, **JSON**, **XLSX**, **XLSM**.\n\n' +
      'You can also ask financial domain questions anytime (e.g., *What is materiality?* or *Budget vs Forecast*).',
      null, ['Supported file formats', 'What is materiality?', 'Budget vs forecast'], true
    );
    updatePhase('awaiting_file');
  }

  // ── Phase Management ───────────────────────────────────────
  function updatePhase(phase) {
    currentPhase = phase;
    phaseLabel.textContent = PHASE_LABELS[phase] || phase;
    inputEl.placeholder = PHASE_PLACEHOLDERS[phase] || 'Type a message...';
    inputEl.disabled = false;
    sendBtn.disabled = false;
  }

  // ── Message Rendering ─────────────────────────────────────
  function addAgentMessage(text, table, chips, showDropZone) {
    const msg = document.createElement('div');
    msg.className = 'message agent';

    const sender = document.createElement('div');
    sender.className = 'message-sender';
    sender.textContent = 'AGENT';
    msg.appendChild(sender);

    const body = document.createElement('div');
    body.className = 'message-body';

    if (text && text.startsWith('\u26a0\ufe0f')) {
      body.classList.add('warning');
    }

    body.innerHTML = renderMarkdown(text || '');
    msg.appendChild(body);

    if (table && table.length > 0) {
      body.appendChild(renderTable(table));
    }

    if (showDropZone) {
      body.appendChild(createDropZone());
    }

    if (chips && chips.length > 0) {
      const chipsEl = document.createElement('div');
      chipsEl.className = 'chips';
      chips.forEach(chipText => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = chipText;
        chip.addEventListener('click', () => {
          addUserMessage(chipText);
          postMessage(chipText);
        });
        chipsEl.appendChild(chip);
      });
      msg.appendChild(chipsEl);
    }

    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function addUserMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'message user';

    const sender = document.createElement('div');
    sender.className = 'message-sender';
    sender.textContent = 'YOU';
    msg.appendChild(sender);

    const body = document.createElement('div');
    body.className = 'message-body';
    body.textContent = text;
    msg.appendChild(body);

    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function addDownloadButton(url, filename) {
    const lastAgent = messagesEl.querySelector('.message.agent:last-of-type');
    if (!lastAgent) return;

    const btn = document.createElement('button');
    btn.className = 'download-btn';
    btn.innerHTML = '⬇ Download ' + escapeHtml(filename);
    btn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
    lastAgent.appendChild(btn);
  }

  // ── Table Rendering ────────────────────────────────────────
  function renderTable(initialRows) {
    const wrapper = document.createElement('div');
    wrapper.className = 'data-table-wrapper';

    if (!initialRows || initialRows.length === 0) return wrapper;

    const table = document.createElement('table');
    table.className = 'data-table';

    let currentRows = [...initialRows];
    let sortCol = null;
    let sortAsc = true;

    const columns = Object.keys(initialRows[0]);
    function isNumericCol(col) {
      return col.startsWith('Var ') || col === 'Budget' || col === 'Actual' || col === 'Status' || col.includes('Impact') || col.includes('Profit') || col.includes('Cumulative');
    }

    function parseNumericVal(val) {
      if (!val) return 0;
      let s = String(val).trim();
      const isNegParen = s.startsWith('(') && s.endsWith(')');
      if (isNegParen) s = s.slice(1, -1);
      s = s.replace(/[\$,€,£,¥,%\s]/g, '');
      let num = parseFloat(s);
      if (isNaN(num)) return 0;
      return isNegParen ? -num : num;
    }

    // Toolbar: quick filter search & row count indicator
    let filterQuery = '';
    const toolbar = document.createElement('div');
    toolbar.className = 'table-toolbar';

    const searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.className = 'table-search-input';
    searchInput.placeholder = '🔍 Filter rows...';
    searchInput.title = 'Filter rows by account name, type, amount, or status';

    const countSpan = document.createElement('span');
    countSpan.className = 'table-row-count';
    countSpan.textContent = `${initialRows.length} rows`;

    toolbar.appendChild(searchInput);
    toolbar.appendChild(countSpan);
    wrapper.appendChild(toolbar);

    // Header
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    const thMap = {};

    columns.forEach(col => {
      const th = document.createElement('th');
      th.className = 'sortable' + (isNumericCol(col) ? ' num' : '');
      th.title = 'Click to sort';

      const labelSpan = document.createElement('span');
      labelSpan.textContent = col;
      th.appendChild(labelSpan);

      const iconSpan = document.createElement('span');
      iconSpan.className = 'sort-icon';
      iconSpan.textContent = '↕';
      th.appendChild(iconSpan);

      th.addEventListener('click', () => {
        if (sortCol === col) {
          sortAsc = !sortAsc;
        } else {
          sortCol = col;
          sortAsc = isNumericCol(col) && col !== 'Status' ? false : true;
        }

        columns.forEach(c => {
          thMap[c].classList.remove('sorted-asc', 'sorted-desc');
          const ic = thMap[c].querySelector('.sort-icon');
          if (ic) ic.textContent = '↕';
        });

        th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
        iconSpan.textContent = sortAsc ? '▲' : '▼';

        updateTable();
      });

      thMap[col] = th;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    function updateTable() {
      let filtered = initialRows.filter(row => {
        if (!filterQuery) return true;
        return columns.some(col => String(row[col] || '').toLowerCase().includes(filterQuery));
      });

      if (sortCol) {
        filtered.sort((a, b) => {
          const valA = a[sortCol] || '';
          const valB = b[sortCol] || '';
          if (isNumericCol(sortCol) && sortCol !== 'Status') {
            const numA = parseNumericVal(valA);
            const numB = parseNumericVal(valB);
            return sortAsc ? numA - numB : numB - numA;
          }
          const strA = String(valA).toLowerCase();
          const strB = String(valB).toLowerCase();
          if (strA < strB) return sortAsc ? -1 : 1;
          if (strA > strB) return sortAsc ? 1 : -1;
          return 0;
        });
      }

      currentRows = filtered;
      countSpan.textContent = filterQuery ? `${currentRows.length} of ${initialRows.length} rows` : `${currentRows.length} rows`;
      renderBody();
    }

    searchInput.addEventListener('input', (e) => {
      filterQuery = e.target.value.toLowerCase().trim();
      updateTable();
    });

    // Body
    const tbody = document.createElement('tbody');
    function renderBody() {
      tbody.innerHTML = '';

      let maxVar = 0;
      currentRows.forEach(row => {
        columns.forEach(col => {
          if (col.startsWith('Var ') || col.includes('Impact')) {
            const v = Math.abs(parseNumericVal(row[col]));
            if (v > maxVar) maxVar = v;
          }
        });
      });

      currentRows.forEach(row => {
        const tr = document.createElement('tr');
        const status = row['Status'] || '';
        if (status === 'F') tr.className = 'row-favorable';
        else if (status === 'U') tr.className = 'row-unfavorable';
        else if (status === 'Neutral') tr.className = 'row-neutral';

        columns.forEach(col => {
          const td = document.createElement('td');
          const val = row[col] || '';
          if (isNumericCol(col)) td.className = 'num';
          if (col === 'Status') {
            td.textContent = val;
            if (val === 'F') td.className += ' status-f';
            else if (val === 'U') td.className += ' status-u';
          } else if (col === 'Line Item') {
            const name = plainText(val);
            td.textContent = name;
            td.className += ' clickable-item';
            td.title = `Click to drill down: Why ${name}?`;
            td.addEventListener('click', (e) => {
              e.stopPropagation();
              const question = `Why ${name}?`;
              addUserMessage(question);
              postMessage(question);
            });
          } else if (col.startsWith('Var ') || col.includes('Impact')) {
            const numVal = parseNumericVal(val);
            const absVal = Math.abs(numVal);
            const pct = maxVar > 0 ? Math.min(100, Math.round((absVal / maxVar) * 100)) : 0;

            const cellWrapper = document.createElement('div');
            cellWrapper.className = 'variance-cell';

            const valSpan = document.createElement('span');
            valSpan.className = 'variance-val';
            valSpan.textContent = val;
            cellWrapper.appendChild(valSpan);

            if (maxVar > 0 && absVal > 0) {
              const barTrack = document.createElement('div');
              barTrack.className = 'variance-bar-track';
              const barFill = document.createElement('div');
              const isFav = status === 'F' || (status !== 'U' && numVal > 0);
              const isUnfav = status === 'U' || (status !== 'F' && numVal < 0);
              barFill.className = 'variance-bar-fill ' + (isFav ? 'bar-favorable' : (isUnfav ? 'bar-unfavorable' : 'bar-neutral'));
              barFill.style.width = Math.max(5, pct) + '%';
              barTrack.appendChild(barFill);
              cellWrapper.appendChild(barTrack);
            }
            td.appendChild(cellWrapper);
          } else {
            td.textContent = plainText(val);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    renderBody();
    table.appendChild(tbody);

    wrapper.appendChild(table);
    return wrapper;
  }

  // ── Drop Zone ──────────────────────────────────────────────
  function createDropZone() {
    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    zone.id = 'drop-zone';

    zone.innerHTML =
      '<div class="drop-zone-icon">📁</div>' +
      '<div class="drop-zone-title">Drop file here or click to browse</div>' +
      '<div class="drop-zone-subtitle">.csv, .json, .xlsx, .xlsm</div>';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.csv,.json,.xlsx,.xlsm';
    zone.appendChild(fileInput);

    zone.addEventListener('click', () => fileInput.click());

    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.classList.add('dragover');
    });

    zone.addEventListener('dragleave', () => {
      zone.classList.remove('dragover');
    });

    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) uploadFile(files[0]);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) uploadFile(fileInput.files[0]);
    });

    return zone;
  }

  function showTypingIndicator() {
    removeTypingIndicator();
    const msg = document.createElement('div');
    msg.className = 'message agent';
    msg.id = 'typing-indicator';

    const sender = document.createElement('div');
    sender.className = 'message-sender';
    sender.textContent = 'Agent';
    msg.appendChild(sender);

    const body = document.createElement('div');
    body.className = 'message-body typing-dots';
    body.innerHTML = '<span></span><span></span><span></span>';
    msg.appendChild(body);

    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // ── File Upload ────────────────────────────────────────────
  async function uploadFile(file) {
    const validExts = ['.csv', '.json', '.xlsx', '.xlsm'];
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    if (!validExts.includes(ext)) {
      addAgentMessage(
        '⚠️ Unsupported file format. Please upload a CSV, JSON, XLSX, or XLSM file.',
        null, null, true
      );
      return;
    }

    addUserMessage('📎 ' + file.name);

    // Remove existing drop zones
    document.querySelectorAll('.drop-zone').forEach(z => z.remove());

    const formData = new FormData();
    formData.append('file', file, file.name);
    formData.append('first_visit', introSeen ? '0' : '1');

    showTypingIndicator();
    try {
      const resp = await fetch('/upload', { method: 'POST', body: formData });
      const data = await resp.json();
      removeTypingIndicator();

      if (data.error) {
        addAgentMessage('⚠️ ' + data.error, null, null, true);
        return;
      }

      if (data.phase) updatePhase(data.phase);
      if (data.phase && data.phase !== 'awaiting_file') markIntroSeen();
      addAgentMessage(data.text, data.table, data.chips, false);

      if (data.download_url) {
        addDownloadButton(data.download_url, data.download_filename);
      }

      inputEl.focus();
    } catch (err) {
      removeTypingIndicator();
      addAgentMessage('⚠️ Upload failed: ' + err.message, null, null, true);
    }
  }

  // ── Send Message ───────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    addUserMessage(text);
    await postMessage(text);
  }

  async function postMessage(text) {
    showTypingIndicator();
    try {
      const resp = await fetch('/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, first_visit: !introSeen }),
      });
      const data = await resp.json();
      removeTypingIndicator();

      // A table pasted while waiting for a file is this visitor's first file.
      if (currentPhase === 'awaiting_file' && data.phase && data.phase !== 'awaiting_file') markIntroSeen();
      if (data.phase) updatePhase(data.phase);

      const showDrop = (data.phase === 'awaiting_file');
      addAgentMessage(data.text, data.table, data.chips, showDrop);

      if (data.download_url) {
        addDownloadButton(data.download_url, data.download_filename);
      }
    } catch (err) {
      removeTypingIndicator();
      addAgentMessage('⚠️ Connection error: ' + err.message);
    }
  }

  // ── Markdown Rendering (minimal, no library) ───────────────
  function renderMarkdown(text) {
    let html = escapeHtml(decodeServerEscapes(text));

    // Markdown backslash escapes (\_ \* \| ...) become literal characters, not formatting
    const literals = [];
    html = html.replace(mdEscapes(), (m, ch) => {
      literals.push(ch);
      return '\u0000' + (literals.length - 1) + '\u0000';
    });

    // Horizontal rule: ---
    html = html.replace(/^---+$/gm, '<hr style="border:0;border-top:1px solid var(--border);margin:12px 0;">');

    // Headers: ###, ##, #
    html = html.replace(/^###\s+(.+)$/gm, '<h4 style="font-size:13px;font-weight:600;margin:8px 0 3px 0;color:#c4b5fd;">$1</h4>');
    html = html.replace(/^##\s+(.+)$/gm, '<h3 style="font-size:15px;font-weight:700;margin:10px 0 4px 0;color:#fff;">$1</h3>');
    html = html.replace(/^#\s+(.+)$/gm, '<h2 style="font-size:17px;font-weight:700;margin:12px 0 6px 0;color:#fff;">$1</h2>');

    // Bold: **text**
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // Italic: *text* (after bold so ** is not eaten)
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

    // Inline code: `text`
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bullet points: • or -
    html = html.replace(/^[•\-]\s+(.+)$/gm, '<div style="padding-left:16px;margin:2px 0;">• $1</div>');

    // Line breaks
    html = html.replace(/\n/g, '<br>');

    return html.replace(/\u0000(\d+)\u0000/g, (m, i) => literals[Number(i)]);
  }

  // Markdown backslash escapes. A function declaration (hoisted) so messages rendered
  // during page start-up can use it.
  function mdEscapes() {
    return /\\([\\`*_{}\[\]()#+\-.!|~>])/g;
  }

  // The server escapes source labels for Markdown/HTML documents (R&D_Costs -> R&amp;D\_Costs).
  // The chat UI escapes HTML itself, so undo the server's entity escapes exactly once here.
  function decodeServerEscapes(text) {
    return text.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }

  // Table cells are set with textContent, so they need plain text with no escapes at all.
  function plainText(text) {
    return decodeServerEscapes(String(text)).replace(mdEscapes(), '$1');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ── Utilities ──────────────────────────────────────────────
  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  // ── Boot ───────────────────────────────────────────────────
  init();
})();
</script>

</body>
