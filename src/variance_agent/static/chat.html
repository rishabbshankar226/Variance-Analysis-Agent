<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variance Analysis Agent</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/chat.css">
<script type="module" src="/static/chat.js"></script>
</head>
<body>

<!-- Header: the mark and name, the current step, Help and Start over -->
<header class="header">
  <div class="header-icon" aria-hidden="true"></div>
  <div class="header-text">
    <h1>Variance Analysis Agent</h1>
  </div>
  <div class="header-status">
    <span class="sr-only">Step:</span>
    <span id="phase-label" role="status">Ready</span>
  </div>
  <div class="header-actions">
    <button type="button" id="btn-quick-help" class="header-action-btn" title="Show everything you can ask"><span class="btn-label">Help</span></button>
    <button type="button" id="btn-quick-reset" class="header-action-btn" title="Clear this session and upload a new file"><span class="btn-label">Start over</span></button>
  </div>
</header>

<!-- Messages: a live log, so new replies are announced and the list can be scrolled by keyboard -->
<div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation" tabindex="0">
  <!-- Welcome message inserted by chat.js -->
</div>

<!-- Input Bar -->
<div class="input-bar">
  <label for="input" class="sr-only">Message</label>
  <textarea
    id="input"
    rows="1"
    placeholder="Upload a file above, or ask a question"
    autocomplete="off"
    enterkeyhint="send"
  ></textarea>
  <button type="button" class="send-btn" id="send-btn" title="Send (Enter)" aria-label="Send message">Send</button>
</div>

<noscript>This page needs JavaScript. The command line (<code>variance-agent --help</code>) works without it.</noscript>

</body>
</html>
